<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>You're offline · Global Warming Explorer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<style>
  .offline-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .offline-card{ max-width:440px; text-align:center; background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:var(--radius); padding:40px 32px; box-shadow:var(--shadow); }
  .offline-card .ico{ font-size:2.6rem; margin-bottom:10px; }
  .offline-card h1{ font-size:1.4rem; margin-bottom:.4em; }
  .offline-card p{ margin-bottom:1.4em; }
</style>
</head>
<body>
<div class="offline-wrap">
  <div class="offline-card">
    <div class="ico">📡</div>
    <h1>You're offline</h1>
    <p>This page hasn't been saved for offline use yet. Pages you've already visited will keep working without a connection, live weather, CO2 and quiz-score sections just need the network to refresh.</p>
    <a class="btn btn-primary" href="index.html">Go to Home</a>
  </div>
</div>
</body>
</html>
