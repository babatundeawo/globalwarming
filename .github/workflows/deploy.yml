name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, deleted]
  schedule:
    - cron: "17 */6 * * *"   # safety-net refresh of the class dashboard
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two deployments at once; a queued run waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read          # lets the build read "Check-in:" issues for the class dashboard
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the class roster from check-in issues
        continue-on-error: true   # if it fails, the last saved roster-data.json is used
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_roster.py

      - name: Generate the pages
        run: python3 build.py

      - name: Check the site (broken links, titles, alt text)
        run: python3 scripts/check_site.py

      - name: Assemble the site folder
        run: |
          mkdir _site
          cp *.html manifest.json sw.js favicon.svg robots.txt sitemap.xml roster-data.json _site/
          cp -r css js images downloads _site/
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::8}/" _site/sw.js

      - name: Lighthouse report (informational)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
