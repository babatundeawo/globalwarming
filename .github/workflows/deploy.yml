name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, deleted]
  schedule:
    - cron: "17 3 * * *"   # daily safety-net refresh of the class dashboard
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two deployments at once; a queued run waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read          # lets the build read "Check-in:" issues for the class dashboard
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Work out the site address
        id: pages
        uses: actions/configure-pages@v6

      - name: Refresh the class roster from check-in issues
        continue-on-error: true   # if it fails, the last saved roster-data.json is used
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_roster.py

      - name: Download the photos
        continue-on-error: true   # if it fails, pages link to Wikimedia directly
        run: python3 scripts/fetch_images.py

      - name: Download fonts and Chart.js (self-hosted for speed and privacy)
        run: python3 scripts/fetch_assets.py   # never fails; the build falls back safely

      - name: Generate the pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 build.py

      - name: Check the site (links, titles, alt text, security policy, manifest)
        run: python3 scripts/check_site.py

      - name: Assemble the site folder
        run: |
          mkdir _site
          cp *.html manifest.json sw.js favicon.svg robots.txt sitemap.xml roster-data.json _site/
          cp -r css js images downloads _site/
          touch _site/.nojekyll

      - name: Take screenshots for the install prompt
        continue-on-error: true
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium
          python3 scripts/make_screenshots.py _site

      - name: Lighthouse report (mobile profile, informational)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Save the built site so a pull request can be inspected
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site
          retention-days: 7

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
