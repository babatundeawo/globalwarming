name: Rebuild teacher packet (manual)

# Run this by hand (Actions tab > this workflow > Run workflow) after editing
# lesson content, to regenerate downloads/teacher-packet.pdf.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium
      - name: Build pages and the PDF
        run: |
          python3 build.py
          python3 scripts/build_teacher_packet.py
      - name: Save the new PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/teacher-packet.pdf
          git diff --cached --quiet && echo "No change." || (git commit -m "chore: rebuild teacher packet" && git push)
